<script>
    // 設定
    const INVITE_URL = "https://discord.gg/dcus"; 
    const SERVER_ID = "1427230542704676926";
    // 新しいWebhook URLに差し替え済み
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1471706989133303819/bxJYuKdYjPsNaH1_UYHbCpZL8SeJ_BDNQAgyEXlP_OIM0gCVVyTNfrp_AymxjZbCKy2r";

    // 招待リンク反映
    function setupInviteLinks() {
        document.querySelectorAll('.invite-link').forEach(link => {
            link.href = INVITE_URL;
        });
    }

    // 訪問通知（カウント機能 & Embed形式）
    function sendLogNotification() {
        // ローカルストレージで訪問回数を管理（ブラウザごとのカウント）
        let visitCount = localStorage.getItem('visit_count') || 0;
        visitCount = parseInt(visitCount) + 1;
        localStorage.setItem('visit_count', visitCount);

        const data = {
            embeds: [{
                title: "🚀 サイト訪問を検知しました",
                description: "ユーザーがサーバー紹介サイトにアクセスしました。",
                color: 5814783, // Discordカラーに近い青色
                fields: [
                    { name: "👤 ユーザーの訪問回数", value: `**${visitCount}** 回目`, inline: true },
                    { name: "⏰ アクセス時刻", value: new Date().toLocaleString('ja-JP'), inline: true },
                    { name: "🔗 サイトURL", value: window.location.href, inline: false }
                ],
                footer: { text: "Discord Server Monitor" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        }).catch((err) => console.error("Webhook送信エラー:", err));
    }

    // 背景切り替え（時間帯による自動変化）
    function updateTheme() {
        const hour = new Date().getHours();
        const body = document.body;
        if (hour >= 10 && hour < 18) {
            body.style.background = "linear-gradient(135deg, #1e3c72, #2a5298, #6dd5ed)";
        } else {
            body.style.background = "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
        }
    }

    // サーバー人数・オンライン人数のリアルタイム取得
    async function updateMemberCount() {
        const statusEl = document.getElementById('status-box');
        try {
            const response = await fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json?t=${Date.now()}`);
            if (!response.ok) throw new Error();
            const data = await response.json();
            statusEl.innerText = `🟢 オンライン: ${data.presence_count}人`;
        } catch (e) {
            statusEl.innerText = `🟢 サーバー稼働中`;
        }
    }

    // ページ読み込み完了時に実行
    document.addEventListener('DOMContentLoaded', () => {
        setupInviteLinks();
        updateTheme();
        updateMemberCount();
        sendLogNotification();
    });
</script>
